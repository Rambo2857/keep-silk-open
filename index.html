<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111111;
  font-family:Arial,sans-serif;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
}
button{
  border:0;
  border-radius:22px;
  padding:12px 22px;
  background:#16a52f;
  color:white;
  font-size:18px;
  font-weight:bold;
  white-space:nowrap;
}
</style>
</head>
<body>
<button id="keep">📌 Seite bleibt offen</button>

<script>
const button = document.getElementById("keep");

button.addEventListener("click", async () => {
  try {
    if ("wakeLock" in navigator) {
      await navigator.wakeLock.request("screen");
      button.textContent = "📌 Seite bleibt offen";
      button.style.background = "#16a52f";
    }
  } catch (e) {
    button.textContent = "Antippen zum Aktivieren";
    button.style.background = "#d85c5c";
  }
});
</script>
</body>
</html>
